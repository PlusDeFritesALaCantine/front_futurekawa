name: CI

on:
  push:
    branches: ["main", "test_moua"]
  pull_request:

jobs:
  validate:
    runs-on: shared-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Build de production
        run: npm run build

      - name: Tests unitaires
        run: npm run test -- --run

      - name: Sauvegarder le Build
        uses: actions/upload-artifact@v4
        with:
          name: front-dist
          path: dist/
          retention-days: 1

  test-e2e:
    needs: validate
    runs-on: shared-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Récupérer le Build du job précédent
        uses: actions/download-artifact@v4
        with:
          name: front-dist
          path: dist/

      - name: Installer Chromium et dépendances minimales
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Démarrer le serveur web statique (Ultra-léger)
        # On lance sirv en arrière-plan sur le port 8080 en redirigeant les requêtes vers index.html (SPA mode)
        run: |
          npx sirv-cli dist --port 8080 --single --quiet &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: Attendre que le serveur soit prêt
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:8080 && break
            echo "En attente du serveur web... ($i)"
            sleep 1
          done

      - name: Tests end-to-end
        # On force 1 seul worker pour économiser la RAM
        run: npm run test:e2e -- --workers=1
        env:
          BASE_URL: http://localhost:8080

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Arrêter le serveur web
        if: always()
        run: |
          # On coupe proprement le processus Node du serveur web s'il est défini
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi