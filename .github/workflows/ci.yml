name: CI/CD Front-end

on:
  push:
    branches: ["main", "test_moua"]
  pull_request:

jobs:
  validate:
    runs-on: shared-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Build de production
        run: npm run build

      - name: Tests unitaires
        run: npm run test -- --run

      - name: Sauvegarder le Build
        uses: actions/upload-artifact@v4
        with:
          name: front-dist
          path: dist/
          retention-days: 1

  test-e2e:
    needs: validate
    runs-on: shared-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Récupérer le Build du job précédent
        uses: actions/download-artifact@v4
        with:
          name: front-dist
          path: dist/

      - name: Installer Chromium et dépendances minimales
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Démarrer le serveur web statique (Ultra-léger)
        run: |
          npx sirv-cli dist --port 8080 --single --quiet &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: Attendre que le serveur soit prêt
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:8080 && break
            echo "En attente du serveur web... ($i)"
            sleep 1
          done

      - name: Tests end-to-end
        run: npm run test:e2e -- --workers=1
        env:
          BASE_URL: http://localhost:8080

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Arrêter le serveur web
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi

  build-and-push:
    needs: [validate, test-e2e]
    if: github.event_name == 'push'
    runs-on: shared-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_URL=http://api.futurekawa.local
          tags: |
            ghcr.io/plusdefritesalacantine/futurekawa-front:latest
            ghcr.io/plusdefritesalacantine/futurekawa-front:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: shared-runners
    steps:
      - name: Mise à jour du projet sur le serveur via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            REPO_DIR="/home/moua/${{ github.event.repository.name }}"

            if [ -d "$REPO_DIR/.git" ]; then
              echo "==> Mise à jour du dépôt existant..."
              cd "$REPO_DIR"
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
            else
              echo "==> Premier déploiement : Clonage du dépôt..."
              git clone -b ${{ github.ref_name }} https://github.com/${{ github.repository }}.git "$REPO_DIR"
            fi
            
            kubectl rollout restart deployment/futurekawa-front -n futurekawa-app || true