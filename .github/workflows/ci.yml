name: CI

on:
  push:
    branches: ["main", "test_moua"]
  pull_request:

jobs:
  validate:
    runs-on: shared-runners

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types & Build
        run: |
          npm run typecheck
          npm run build

      - name: Tests unitaires
        run: npm run test -- --run

  test-e2e:
    needs: validate
    runs-on: shared-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end
        run: npm run test:e2e

      - name: Build de production
        run: npm run build

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
