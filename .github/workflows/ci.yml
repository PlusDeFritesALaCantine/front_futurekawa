name: CI/CD Pipeline

on:
  push:
    branches: ["main", "test_moua"]
  pull_request:
    branches: ["main", "test_moua"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: shared-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm run typecheck
          npm run test -- --run
          npm run build

  build-and-push:
    runs-on: shared-runners
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: PlusDeFritesALaCantine
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: kubernetes
          driver-opts: |
            namespace=arc-runners

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_URL=http://api.futurekawa.local
          tags: |
            ghcr.io/plusdefritesalacantine/front_futurekawa:latest
            ghcr.io/plusdefritesalacantine/front_futurekawa:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: shared-runners
    needs: build-and-push
    if: startsWith(github.ref, 'refs/heads/') && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "" >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          ssh -i ~/.ssh/id_ed25519 moua@${{ secrets.SERVER_HOST }} "mkdir -p /home/moua/$REPO_NAME"
          scp -i ~/.ssh/id_ed25519 -r ./* moua@${{ secrets.SERVER_HOST }}:/home/moua/$REPO_NAME/
          ssh -i ~/.ssh/id_ed25519 moua@${{ secrets.SERVER_HOST }} "kubectl rollout restart deployment/futurekawa-front -n futurekawa-app || true"